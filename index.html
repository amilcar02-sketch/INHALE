argin:0 0 21px;color:#b5d4c5;font-size:14px;min-height:21px}.time{font-size:13px;color:#d0e6d8;font-variant-numeric:tabular-nums;margin:0 0 16px}.bar{height:5px;border-radius:8px;background:#ffffff24;overflow:hidden;margin:0 14px 25px}.fill{height:100%;width:0;background:#c9eacb;border-radius:inherit}.controls{display:flex;justify-content:center;gap:10px}.primary,.secondary{border-radius:15px;padding:15px 22px;font-size:16px;font-weight:700;cursor:pointer}.primary{border:0;background:#d0f0cf;color:#163732;min-width:175px}.secondary{border:1px solid #77988c;background:transparent;color:#e8f3ea}.secondary[hidden]{display:none}.history{margin:30px 0 0;text-align:left;border-top:1px solid #ffffff32;padding-top:20px}.history h2{font:400 25px Georgia,serif;margin:0 0 12px}.history p{color:#b9d5c8;font-size:13px}.history-list{display:grid;gap:9px}.history-item{padding:12px 14px;background:#ffffff0b;border:1px solid #ffffff26;border-radius:13px}.history-item strong{display:block;font-size:14px;font-weight:600}.history-item span{display:block;color:#bad4c7;font-size:12px;margin-top:4px}.sound-control{margin:16px auto 0;border:1px solid #77988c;background:#ffffff0d;color:#e8f3ea;border-radius:100px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}.sound-note{font-size:12px;color:#9dbdb0;margin:8px 0 0}.guide{margin:28px 0 0;color:#9dbdb0;font-size:12px;line-height:1.7}.guide strong{color:#d4e9d8;font-weight:600}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.orb{transition:none!important}}

<body><main>
<p class="eyebrow">Un momento para ti</p><h1>Inhale</h1><p class="sub">Respira a tu ritmo. Sigue la voz visual del círculo.</p>
<div class="choices" role="group" aria-label="Duración de la sesión"><button class="choice" data-min="1" aria-pressed="true">1 min</button><button class="choice" data-min="3" aria-pressed="false">3 min</button><button class="choice" data-min="5" aria-pressed="false">5 min</button></div>
<div class="visual" aria-hidden="true"><div class="track"></div><div class="orb instant" id="orb"><div class="inside"><span class="number" id="count">4</span><span class="seconds">segundos</span></div></div></div>
<h2 class="action" id="action" aria-live="polite">Prepárate</h2><p class="hint" id="hint">Inhala · Sostén · Exhala · Sostén</p>
<p class="time" id="time">01:00 restante</p><div class="bar" role="progressbar" aria-label="Progreso de la sesión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div>
<div class="controls"><button class="primary" id="start">Comenzar</button><button class="secondary" id="reset" hidden>Reiniciar</button></div><button class="sound-control" id="sound" type="button" aria-pressed="true">♪ Sonido activado</button><p class="sound-note">Un pulso por segundo · inhalar, sostener y exhalar</p>
<p class="guide"><strong>Respiración cuadrada</strong><br>Inhala 4 s · Sostén 4 s · Exhala 4 s · Sostén 4 s</p>
<section class="history" aria-label="Historial de sesiones"><h2>Tu historial</h2><div class="history-list" id="history"></div></section></main><script>
(()=>{'use strict';const phases=[['Inhala','El círculo crece contigo','inhale'],['Sostén','Mantén el aire suavemente','holdFull'],['Exhala','Suelta el aire despacio','exhale'],['Sostén','Antes de volver a inhalar','holdEmpty']];const $=id=>document.getElementById(id),choices=[...document.querySelectorAll('.choice')];let duration=60,elapsed=0,startedAt=0,sessionStart=null,ticker=null,state='idle',lastPhase=-1;const HISTORY_KEY='inhale_history_v1';let soundOn=true,audio=null,lastBeat=-1;const pad=n=>String(n).padStart(2,'0');function render(){const remaining=Math.max(0,Math.ceil(duration-elapsed));$('time').textContent=`${pad(Math.floor(remaining/60))}:${pad(remaining%60)} restante`;$('fill').style.width=`${Math.min(100,elapsed/duration*100)}%`;$('progress').setAttribute('aria-valuenow',Math.round(elapsed/duration*100));if(state==='done')return; if(state==='idle')return;const index=Math.floor(Math.min(elapsed,duration-.001)/4)%4,step=Math.floor(elapsed)%4,phase=phases[index];$('action').textContent=phase[0];$('hint').textContent=phase[1];$('count').textContent=Math.min(4-step,remaining);if(index!==lastPhase){const orb=$('orb');orb.className='orb '+phase[2]+(state==='paused'?' instant':'');lastPhase=index}if(state==='paused')$('orb').classList.add('instant')}
function finish(){saveSession();clearInterval(ticker);ticker=null;elapsed=duration;state='done';render();$('orb').className='orb holdEmpty instant';$('action').textContent='Sesión completada';$('hint').textContent='Tómate un momento para notar cómo te sientes';$('count').textContent='✓';$('start').textContent='Repetir';$('reset').hidden=true;choices.forEach(b=>b.disabled=false)}function tick(){elapsed=Math.min(duration,(performance.now()-startedAt)/1000);if(elapsed>=duration){finish();return}render();soundTick()}function run(){if(!sessionStart)sessionStart=new Date();startedAt=performance.now()-elapsed*1000;state='running';$('start').textContent='Pausar';$('reset').hidden=false;choices.forEach(b=>b.disabled=true);lastPhase=-1;lastBeat=-1;unlockAudio();render();soundTick();ticker=setInterval(tick,100)}function restart(){sessionStart=null;clearInterval(ticker);ticker=null;elapsed=0;lastPhase=-1;lastBeat=-1;state='idle';$('orb').className='orb instant';$('count').textContent='4';$('action').textContent='Prepárate';$('hint').textContent='Inhala · Sostén · Exhala · Sostén';$('start').textContent='Comenzar';$('reset').hidden=true;choices.forEach(b=>b.disabled=false);render()}choices.forEach(b=>b.addEventListener('click',()=>{duration=Number(b.dataset.min)*60;choices.forEach(c=>c.setAttribute('aria-pressed',String(c===b)));restart()}));$('start').addEventListener('click',()=>{if(state==='running'){tick();clearInterval(ticker);ticker=null;state='paused';lastBeat=-1;$('orb').classList.add('instant');$('start').textContent='Continuar';$('hint').textContent='Sesión en pausa'}else{if(state==='done')restart();run()}});$('reset').addEventListener('click',restart);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running'){$('start').click()}});function saveSession(){if(!sessionStart)return;const ended=new Date(),entry={start:sessionStart.toISOString(),end:ended.toISOString(),minutes:duration/60,seconds:Math.round((ended-sessionStart)/1000)};try{const list=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');list.unshift(entry);localStorage.setItem(HISTORY_KEY,JSON.stringify(list));renderHistory()}catch(e){$('history').textContent='No se pudo guardar el historial en este navegador.'}sessionStart=null}
function renderHistory(){let list=[];try{list=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(list))list=[]}catch(e){}const host=$('history');if(!list.length){host.innerHTML='<p>Aquí aparecerán tus sesiones completadas.</p>';return}host.replaceChildren(...list.map(item=>{const row=document.createElement('div');row.className='history-item';const title=document.createElement('strong'),detail=document.createElement('span'),start=new Date(item.start),end=new Date(item.end);title.textContent=start.toLocaleDateString('es-DO',{day:'2-digit',month:'short',year:'numeric'});const total=Number(item.seconds)||0;detail.textContent='Inicio '+start.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})+' · Fin '+end.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})+' · Duración '+(total>=60?Math.floor(total/60)+' min ':'')+(total%60)+' s';row.append(title,detail);return row}))}
function unlockAudio(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){soundOn=false;updateSoundButton()}}
function updateSoundButton(){$('sound').textContent=soundOn?'♪ Sonido activado':'♪ Sonido apagado';$('sound').setAttribute('aria-pressed',String(soundOn))}
function tone(freq,length,volume,type='sine',endFreq=freq){
 if(!audio||audio.state!=='running')return;
 const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(endFreq,now+length);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.02);
 g.gain.exponentialRampToValueAtTime(.0001,now+length);
 o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+length+.02)
}
function soundTick(){
 if(!soundOn||state!=='running')return;
 const beat=Math.floor(elapsed);if(beat===lastBeat||beat>=duration)return;lastBeat=beat;
 const phase=Math.floor(beat/4)%4,step=beat%4;
 if(phase===0)tone([390,430,470,510][step],.25,.24,'sine',[450,490,530,570][step]);
 else if(phase===1||phase===3)tone(780,.13,.15,'triangle',590);
 else tone([560,510,460,410][step],.34,.22,'sine',[490,440,390,340][step]);
}
$('sound').addEventListener('click',()=>{soundOn=!soundOn;updateSoundButton();if(soundOn){unlockAudio();lastBeat=-1;soundTick()}});renderHistory();render()})();
