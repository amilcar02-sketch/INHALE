<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b2c">
<title>Inhale · Respiración cuadrada</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef6ed;background:#102b2c}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 22%,#27504b 0%,#173a3b 38%,#102b2c 80%);display:grid;place-items:center;padding:24px 16px env(safe-area-inset-bottom)}main{width:min(100%,450px);text-align:center}.eyebrow{font-size:11px;letter-spacing:.27em;text-transform:uppercase;color:#a6d2bb;font-weight:700;margin:0 0 12px}h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,60px);font-weight:400;letter-spacing:-.05em;margin:0}.sub{color:#b9d5c8;font-size:15px;line-height:1.5;margin:8px auto 28px}.choices{display:flex;justify-content:center;gap:9px;margin-bottom:26px}.choice{border:1px solid #64857d;background:#ffffff0d;color:#e5f3e9;border-radius:100px;padding:11px 19px;font:600 14px inherit;cursor:pointer}.choice[aria-pressed=true]{background:#c9eacb;color:#163532;border-color:#c9eacb}.choice:disabled{opacity:.5;cursor:default}.visual{width:min(75vw,290px);height:min(75vw,290px);margin:0 auto 24px;position:relative;display:grid;place-items:center}.track{position:absolute;inset:12px;border:2px solid #719b8a;border-radius:29px;opacity:.65}.orb{width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dff8db,#89c4a7 65%,#498675);box-shadow:0 0 65px #9cdbb650,0 14px 50px #081b1c90;display:grid;place-items:center;color:#153b34;transform:scale(.78);transition:transform 4s linear,background 1s}.orb.inhale{transform:scale(1)}.orb.holdFull{transform:scale(1)}.orb.exhale,.orb.holdEmpty{transform:scale(.78)}.orb.instant{transition:none}.inside{display:flex;flex-direction:column;align-items:center;gap:0}.number{font-size:clamp(64px,18vw,86px);font-weight:300;line-height:1;font-variant-numeric:tabular-nums}.seconds{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.action{font-family:Georgia,serif;font-size:34px;margin:0 0 5px;font-weight:400}.hint{margin:0 0 21px;color:#b5d4c5;font-size:14px;min-height:21px}.time{font-size:13px;color:#d0e6d8;font-variant-numeric:tabular-nums;margin:0 0 16px}.bar{height:5px;border-radius:8px;background:#ffffff24;overflow:hidden;margin:0 14px 25px}.fill{height:100%;width:0;background:#c9eacb;border-radius:inherit}.controls{display:flex;justify-content:center;gap:10px}.primary,.secondary{border-radius:15px;padding:15px 22px;font-size:16px;font-weight:700;cursor:pointer}.primary{border:0;background:#d0f0cf;color:#163732;min-width:175px}.secondary{border:1px solid #77988c;background:transparent;color:#e8f3ea}.secondary[hidden]{display:none}.guide{margin:28px 0 0;color:#9dbdb0;font-size:12px;line-height:1.7}.guide strong{color:#d4e9d8;font-weight:600}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.orb{transition:none!important}}
</style>
</head>
<body><main>
<p class="eyebrow">Un momento para ti</p><h1>Inhale</h1><p class="sub">Respira a tu ritmo. Sigue la voz visual del círculo.</p>
<div class="choices" role="group" aria-label="Duración de la sesión"><button class="choice" data-min="1" aria-pressed="true">1 min</button><button class="choice" data-min="3" aria-pressed="false">3 min</button><button class="choice" data-min="5" aria-pressed="false">5 min</button></div>
<div class="visual" aria-hidden="true"><div class="track"></div><div class="orb instant" id="orb"><div class="inside"><span class="number" id="count">4</span><span class="seconds">segundos</span></div></div></div>
<h2 class="action" id="action" aria-live="polite">Prepárate</h2><p class="hint" id="hint">Inhala · Sostén · Exhala · Sostén</p>
<p class="time" id="time">01:00 restante</p><div class="bar" role="progressbar" aria-label="Progreso de la sesión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div>
<div class="controls"><button class="primary" id="start">Comenzar</button><button class="secondary" id="reset" hidden>Reiniciar</button></div>
<p class="guide"><strong>Respiración cuadrada</strong><br>Inhala 4 s · Sostén 4 s · Exhala 4 s · Sostén 4 s</p>
</main><script>
(()=>{'use strict';const phases=[['Inhala','El círculo crece contigo','inhale'],['Sostén','Mantén el aire suavemente','holdFull'],['Exhala','Suelta el aire despacio','exhale'],['Sostén','Antes de volver a inhalar','holdEmpty']];const $=id=>document.getElementById(id),choices=[...document.querySelectorAll('.choice')];let duration=60,elapsed=0,startedAt=0,ticker=null,state='idle',lastPhase=-1;const pad=n=>String(n).padStart(2,'0');function render(){const remaining=Math.max(0,Math.ceil(duration-elapsed));$('time').textContent=`${pad(Math.floor(remaining/60))}:${pad(remaining%60)} restante`;$('fill').style.width=`${Math.min(100,elapsed/duration*100)}%`;$('progress').setAttribute('aria-valuenow',Math.round(elapsed/duration*100));if(state==='done')return; if(state==='idle')return;const index=Math.floor(Math.min(elapsed,duration-.001)/4)%4,step=Math.floor(elapsed)%4,phase=phases[index];$('action').textContent=phase[0];$('hint').textContent=phase[1];$('count').textContent=Math.min(4-step,remaining);if(index!==lastPhase){const orb=$('orb');orb.className='orb '+phase[2]+(state==='paused'?' instant':'');lastPhase=index}if(state==='paused')$('orb').classList.add('instant')}
function finish(){clearInterval(ticker);ticker=null;elapsed=duration;state='done';render();$('orb').className='orb holdEmpty instant';$('action').textContent='Sesión completada';$('hint').textContent='Tómate un momento para notar cómo te sientes';$('count').textContent='✓';$('start').textContent='Repetir';$('reset').hidden=true;choices.forEach(b=>b.disabled=false)}function tick(){elapsed=Math.min(duration,(performance.now()-startedAt)/1000);if(elapsed>=duration){finish();return}render()}function run(){startedAt=performance.now()-elapsed*1000;state='running';$('start').textContent='Pausar';$('reset').hidden=false;choices.forEach(b=>b.disabled=true);lastPhase=-1;render();ticker=setInterval(tick,100)}function restart(){clearInterval(ticker);ticker=null;elapsed=0;lastPhase=-1;state='idle';$('orb').className='orb instant';$('count').textContent='4';$('action').textContent='Prepárate';$('hint').textContent='Inhala · Sostén · Exhala · Sostén';$('start').textContent='Comenzar';$('reset').hidden=true;choices.forEach(b=>b.disabled=false);render()}choices.forEach(b=>b.addEventListener('click',()=>{duration=Number(b.dataset.min)*60;choices.forEach(c=>c.setAttribute('aria-pressed',String(c===b)));restart()}));$('start').addEventListener('click',()=>{if(state==='running'){tick();clearInterval(ticker);ticker=null;state='paused';$('orb').classList.add('instant');$('start').textContent='Continuar';$('hint').textContent='Sesión en pausa'}else{if(state==='done')restart();run()}});$('reset').addEventListener('click',restart);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running'){$('start').click()}});render()})();
</script></body></html>
